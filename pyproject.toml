[tool.poetry]
name        = "dialog-text-to-summary"
version     = "0.1.0"
description = "research repo for speech dialog text summarization"
authors     = ["ChokosenLoveti <your@email>"]
readme      = "README.md"

[tool.poetry.dependencies]
python                  = "^3.10"
numpy                   = ">=1.26,<2.0"     # ★ ここを追加
python-dotenv           = "^1.1.0"
pytube                  = "^15.0.0"
youtube-transcript-api  = { version = "^1.0.3", python = "<3.14" }
google-api-python-client = "^2.169.0"
pandas                  = "^2.2.3"
isodate                 = "^0.7.2"
tqdm                    = "^4.67.1"
datasets                = "^3.5.1"
peft                    = "^0.15.2"
transformers            = "^4.51.3"
evaluate                = "^0.4.3"
sentencepiece           = "^0.2.0"
bitsandbytes            = "^0.45.5"

# ★ PyTorch 関連（CUDA 12.1 ビルド例）
torch       = { version = "2.2.2", source = "pytorch-cu121" }
torchvision = { version = "0.17.2", source = "pytorch-cu121" }
torchaudio  = { version = "2.2.2", source = "pytorch-cu121" }

[tool.poetry.group.dev.dependencies]
# pytest や black を入れるならここに

[[tool.poetry.source]]
name     = "pytorch-cu121"
url      = "https://download.pytorch.org/whl/cu121"
priority = "explicit"
